# ─────────────────────────────────────────────────────────────────
# TalkHire — Self-Hosted LiveKit + Backend Docker Compose
# ─────────────────────────────────────────────────────────────────
#
# Launches two services:
#   1. LiveKit SFU server  → port 7881 (signaling) + 7882 (media)
#   2. TalkHire backend    → port 7862 (FastAPI + static frontend)
#
# Prohibited ports (never used): 5432, 6379, 8000–8002, 8080, 7880
#
# Usage:
#   docker compose -f livekit_infra/docker-compose.livekit.yml up -d
# ─────────────────────────────────────────────────────────────────

services:

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: talkhire-livekit
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-THK_aravind97}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-ZTKIVSQdq9UpObxVwfMvAmTpWLNUxRvaz0B_RgTnhoE}
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s

  talkhire-backend:
    build:
      context: ..
      dockerfile: livekit_infra/Dockerfile.backend
    container_name: talkhire-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      - LIVEKIT_URL=ws://localhost:7881
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-THK_aravind97}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-ZTKIVSQdq9UpObxVwfMvAmTpWLNUxRvaz0B_RgTnhoE}
      - APP_PORT=7862
    depends_on:
      livekit-server:
        condition: service_started
    volumes:
      - ../bot:/app/bot:ro
      - ../frontend/dist:/app/frontend/dist:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7862/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
